# LocalLife Admin / portals — Railway config-as-code
# In Railway Admin service → Settings → Config-as-code → Railway Config File:
#   /apps/admin/railway.toml
#
# Do NOT use /railway.toml (removed) or the API config — that builds Nest/Prisma.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/admin/Dockerfile"
watchPatterns = ["apps/admin/**", "pnpm-lock.yaml", "package.json"]

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
